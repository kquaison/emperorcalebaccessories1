services:
  - type: web
    name: emperor-caleb-accessories
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: emperor-caleb-store-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
