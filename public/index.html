<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMPEROR CALEB ACCESSORIES</title>
    <meta
      name="description"
      content="EMPEROR CALEB ACCESSORIES offers premium accessories and separate admin controls for managing the store."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .portal {
        min-height: 70vh;
        display: grid;
        place-items: center;
        padding: 4rem 1rem;
        background: linear-gradient(180deg, #faf7ff 0%, #f1ebff 100%);
      }

      .portal-card {
        max-width: 760px;
        background: white;
        border: 1px solid rgba(22, 19, 31, 0.08);
        border-radius: 28px;
        padding: 2.5rem;
        box-shadow: 0 20px 40px rgba(30, 21, 42, 0.08);
        text-align: center;
      }

      .portal-actions {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <div class="brand">
          <span class="brand-mark">ECA</span>
          <span>EMPEROR CALEB ACCESSORIES</span>
        </div>
      </div>
    </header>

    <main class="portal">
      <div class="portal-card">
        <p class="eyebrow">Welcome</p>
        <h1>Choose your access point</h1>
        <p class="lead">
          Customers can browse only the products posted by the admin. The admin area is completely separate and secured.
        </p>
        <div class="portal-actions">
          <a class="button button-primary" href="/customer">Customer Site</a>
          <a class="button button-secondary" href="/admin">Admin Panel</a>
        </div>
      </div>
    </main>
  </body>
</html>
