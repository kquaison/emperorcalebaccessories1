<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | EMPEROR CALEB ACCESSORIES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: #f6f3ff;
      }

      .admin-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }

      .admin-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .admin-panel {
        background: white;
        border: 1px solid rgba(22, 19, 31, 0.08);
        border-radius: 22px;
        padding: 1.5rem;
        box-shadow: 0 12px 24px rgba(31, 21, 49, 0.06);
      }

      .login-box {
        max-width: 420px;
        margin: 5rem auto 0;
        background: white;
        border-radius: 24px;
        padding: 2rem;
        box-shadow: var(--shadow);
      }

      .admin-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 1.5rem;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 0.85rem 0.75rem;
        border-bottom: 1px solid rgba(22, 19, 31, 0.08);
        vertical-align: top;
      }

      th {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div id="loginView" class="login-box">
        <p class="eyebrow">Admin access</p>
        <h2>Login to manage accessories</h2>
        <form id="loginForm" class="checkout-form">
          <label>
            Username
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="button button-primary full-width">Login</button>
        </form>
        <p id="loginMessage" class="form-message" aria-live="polite"></p>
      </div>

      <div id="dashboardView" class="hidden">
        <div class="admin-topbar">
          <div>
            <p class="eyebrow">Control center</p>
            <h2>EMPEROR CALEB ACCESSORIES Dashboard</h2>
          </div>
          <button id="logoutBtn" class="button button-secondary" type="button">Logout</button>
        </div>

        <div class="admin-grid">
          <section class="admin-panel">
            <div class="section-heading">
              <p class="eyebrow">Inventory</p>
              <h3>Add new accessory</h3>
            </div>
            <form id="adminForm" class="checkout-form">
              <div class="field-grid">
                <label>
                  Accessory name
                  <input type="text" name="name" required />
                </label>
                <label>
                  Category
                  <input type="text" name="category" required />
                </label>
                <label>
                  Price (GH₵)
                  <input type="number" step="0.01" min="0" name="price" required />
                </label>
                <label>
                  Stock quantity
                  <input type="number" min="1" name="stock" value="1" required />
                </label>
                <div class="full-span photo-upload-field">
                  <label for="productPhoto">Product photo</label>
                  <input id="productPhoto" type="file" name="image" accept="image/*" required />
                  <label class="button button-secondary photo-upload-button" for="productPhoto">Upload Product Photo</label>
                  <div id="productPhotoPreview" class="photo-preview" aria-live="polite"></div>
                </div>
                <label class="full-span">
                  Description
                  <textarea name="description" rows="3" placeholder="Short product description"></textarea>
                </label>
                <label class="full-span trending-option">
                  <input type="checkbox" name="trending" />
                  Set as the trending item (replaces the current one)
                </label>
              </div>
              <button type="submit" class="button button-primary">Publish Accessory</button>
            </form>
            <p id="adminMessage" class="form-message" aria-live="polite"></p>
          </section>

          <section class="admin-panel">
            <div class="section-heading">
              <p class="eyebrow">Overview</p>
              <h3>Latest orders</h3>
            </div>
            <div id="orderList" class="table-wrap"></div>
          </section>
        </div>

        <section class="admin-panel" style="margin-top: 1.5rem;">
          <div class="section-heading">
            <p class="eyebrow">Catalog</p>
            <h3>Current accessories</h3>
          </div>
          <div id="productList" class="table-wrap"></div>
        </section>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
